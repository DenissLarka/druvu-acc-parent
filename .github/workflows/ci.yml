# Builds and verifies the reactor on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before it lands on main —
# the publish workflow only runs on release, so without this a red build stays invisible until
# release time. It is also what lets Renovate's auto-merge fire: with no status check, its PRs sit
# open indefinitely.
#
# The reactor declares a GitHub Packages repository (other druvu libs), which needs authentication
# even for public packages, so setup-java writes a settings.xml wired to the automatic GITHUB_TOKEN.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
          server-id: github # matches the <repositories> entry in pom.xml
          settings-path: ${{ github.workspace }}

      - name: Build and verify
        run: mvn -B verify -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
