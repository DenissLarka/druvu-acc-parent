# Builds and verifies the reactor on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before it lands on main —
# the publish workflow only runs on release, so without this a red build stays invisible until
# release time. It is also what lets Renovate's auto-merge fire: with no status check, its PRs sit
# open indefinitely.
#
# Every dependency resolves from Maven Central (druvu-lib-loader included), so no registry
# authentication is wired in: this build sees exactly what a consumer's build sees.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build and verify
        run: mvn -B verify
